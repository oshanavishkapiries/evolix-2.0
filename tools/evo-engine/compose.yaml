services:
  evo-engine:
    build:
      context: .
    image: evo-engine:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      EVO_SECRET_TOKEN: ${EVO_SECRET_TOKEN:?Set EVO_SECRET_TOKEN in .env before starting}
      DOWNLOAD_DIR: /app/downloads
      TEMP_DIR: /app/temp
      SQLITE_DB_PATH: /app/data/evo_engine.sqlite3
    ports:
      - "${EVO_BIND_ADDRESS:-127.0.0.1}:${EVO_PORT:-8000}:8000"
    volumes:
      - engine-data:/app/data
      - engine-downloads:/app/downloads
      - engine-temp:/app/temp
    shm_size: "1gb"
    stop_grace_period: 2m

volumes:
  engine-data:
  engine-downloads:
  engine-temp:
